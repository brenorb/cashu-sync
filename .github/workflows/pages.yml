name: Deploy wallet to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - name: Install wallet dependencies
        working-directory: wallet
        run: npm ci
      - name: Test wallet
        working-directory: wallet
        run: npm run test:ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Test relay
        working-directory: relay
        run: go test ./...
      - name: Build wallet PWA for Pages
        working-directory: wallet
        run: npm run build:pwa:pages
      - name: Smoke-test the Pages subpath
        working-directory: wallet
        run: npm run smoke:pwa:pages
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: wallet/dist/pwa

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy wallet
        id: deployment
        uses: actions/deploy-pages@v4
