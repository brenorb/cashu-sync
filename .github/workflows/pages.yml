name: Deploy wallet to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - name: Install wallet dependencies
        working-directory: wallet
        run: npm ci
      - name: Build wallet PWA for Pages
        working-directory: wallet
        run: npm run build:pwa:pages
      - name: Smoke-test the Pages subpath
        working-directory: wallet
        run: npm run smoke:pwa:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wallet/dist/pwa

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy wallet
        id: deployment
        uses: actions/deploy-pages@v4
