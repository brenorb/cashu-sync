app = "cashu-sync-pairing-relay"
primary_region = "ams"

[build]
dockerfile = "Dockerfile.pairing.fly"

[env]
CASHU_SYNC_PAIRING_LISTEN_ADDR = "0.0.0.0:8080"
CASHU_SYNC_PAIRING_MAX_AGE_SECONDS = "300"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[vm]]
memory = "256mb"
cpu_kind = "shared"
cpus = 1
